<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"

<ui:composition>

                            <linearGradient id="loaderShieldGrad" x1="4" y1="3" x2="32" y2="33" gradientUnits="userSpaceOnUse">

                                <stop offset="50%" stop-color="#131316" />
                                <stop offset="100%" stop-color="#09090B" />
                            </linearGradient>
                            <linearGradient id="loaderBorderGrad" x1="2" y1="2" x2="34" y2="34" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#FAFAFA" />
                                <stop offset="45%" stop-color="#A1A1AA" />
                                <stop offset="100%" stop-color="#34D399" />
                            </linearGradient>
                            <linearGradient id="loaderCheckGrad" x1="10" y1="12" x2="27" y2="25" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#FFFFFF" />

                                <stop offset="100%" stop-color="#34D399" />

                              stroke="url(#loaderCheckGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />

                        <circle cx="25.8" cy="11.5" r="1.6" fill="#34D399" />
                    </svg>
                </div>
            </div>
            <h2 class="loader-title">VERIF ENGINE</h2>
            <p class="loader-status-text">Processing verification data...</p>
            <div class="loader-progress-track">

            </div>
        </div>
    </div>
