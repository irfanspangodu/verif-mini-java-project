# ==============================================================================
# Verif Profile Verification System - Dedicated MySQL Production Profile
# ==============================================================================
# SECURITY NOTICE:
# Do NOT commit real database passwords to public source control repositories.
# Supply credentials via environment variables (e.g., MYSQL_USER, MYSQL_PASSWORD)
# or an uncommitted application-local.properties file protected by .gitignore.
# ==============================================================================

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:verif_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}

# Hibernate / JPA MySQL Dialect & Strategy
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Initial Data Seeding for MySQL
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# Production Mail Settings (Configure with your live SMTP credentials)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Production JSF Runtime: Mojarra optimizations, no view recompilation
verif.faces.project-stage=Production
verif.faces.facelets-refresh-period=-1
