# ==============================================================================
# Verif Profile Verification System - Application Configuration
# ==============================================================================

# Server Port
server.port=8080
server.servlet.context-path=/

# JoinFaces & Jakarta Faces / Mojarra Configuration
joinfaces.faces-servlet.enabled=true
joinfaces.faces-servlet.url-mappings=*.xhtml,*.jsf,/faces/*
joinfaces.mojarra.client-state-saving-password=verif-secret-key-salt

# Default Development Datasource (Embedded H2 for Instant Out-of-the-Box Run)
# Note: To activate the Production MySQL database, pass: --spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:mem:verif_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Initial Data Seeding
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# JavaMail Configuration (Local Development Fallback / SMTP Properties)
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=notifications@verif-system.com
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.connectiontimeout=3000

# Verif Domain Specific Configuration
verif.mail.from=Verif Verification <notifications@verif-system.com>
verif.mail.admin=admin@verif-system.com

# JSF / Facelets Runtime (Development: verbose errors + hot reload)
verif.faces.project-stage=Development
verif.faces.facelets-refresh-period=1

# Logging
logging.level.com.verif=INFO
logging.level.org.joinfaces=INFO
logging.level.org.springframework.web=INFO
